<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saki's Typesetter Handbook</title>
  <meta name="description" content="Curated font presets for manga & comics typesetting. Filter, preview, and copy font names." />

  <!-- Google Fonts UI — cloud only, no local files -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* ── CSS Variables: ALL color theming lives here ─────────────── */
    :root {
      --bg:           #f6fafe;
      --bg-low:       #f0f4f8;
      --bg-card:      #ffffff;
      --bg-ctrl:      #e4e9ed;
      --bg-chip:      #eaeef2;
      --bg-chip-sel:  #d5e3fd;
      --text:         #171c1f;
      --text-muted:   #45464d;
      --text-faint:   #76777d;
      --chip-sel-fg:  #57657b;
      --border:       rgba(198,198,205,0.18);
      --shadow:       rgba(23,28,31,0.07);
      --nav-bg:       #f6fafe;
      --sidebar-bg:   #f0f4f8;
      --tint:         #565e74;
    }
    html.dark {
      --bg:           #0f172a;
      --bg-low:       #1e293b;
      --bg-card:      #1e293b;
      --bg-ctrl:      #334155;
      --bg-chip:      #2d3f55;
      --bg-chip-sel:  #1e3a5f;
      --text:         #e2e8f0;
      --text-muted:   #94a3b8;
      --text-faint:   #64748b;
      --chip-sel-fg:  #93c5fd;
      --border:       rgba(51,65,85,0.5);
      --shadow:       rgba(0,0,0,0.3);
      --nav-bg:       #0f172a;
      --sidebar-bg:   #1e293b;
      --tint:         #93c5fd;
    }

    /* ── Base ──────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background .2s, color .2s;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
      user-select: none;
    }

    /* ── Top nav ───────────────────────────────────────────────────── */
    #topnav {
      background: var(--nav-bg);
      border-bottom: 1px solid var(--border);
    }

    /* ── Sidebar ───────────────────────────────────────────────────── */
    #sidebar {
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
    }

    /* ── Controls bar ──────────────────────────────────────────────── */
    #ctrl-bar {
      background: var(--bg-low);
      border-bottom: 1px solid var(--border);
    }

    /* ── Search input ──────────────────────────────────────────────── */
    #q {
      background: var(--bg-ctrl);
      color: var(--text);
      border: none;
      outline: none;
    }
    #q::placeholder { color: var(--text-faint); }
    #q:focus { box-shadow: 0 0 0 2px var(--tint); }

    /* ── Slider ────────────────────────────────────────────────────── */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: var(--bg-ctrl);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--text);
      cursor: pointer;
    }

    /* ── Inline text input (preview text) ─────────────────────────── */
    .text-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Inter', sans-serif;
    }
    .text-input::placeholder { color: var(--text-faint); }

    /* ── Select ────────────────────────────────────────────────────── */
    select {
      background: var(--bg-ctrl);
      color: var(--text);
      border: none;
      outline: none;
      cursor: pointer;
      border-radius: 0.5rem;
      padding: 6px 10px;
      font-size: 12px;
    }

    /* ── Ctrl buttons (AA, Stroke, …) ──────────────────────────────── */
    .ctrl-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 12px;
      border-radius: 0.75rem;
      background: var(--bg-ctrl);
      color: var(--text-muted);
      font-size: 11px; font-weight: 700;
      border: none; cursor: pointer;
      transition: background .15s, color .15s;
      white-space: nowrap;
      user-select: none;
    }
    .ctrl-btn:hover { background: var(--bg-chip-sel); color: var(--chip-sel-fg); }
    .ctrl-btn.active { background: var(--bg-chip-sel); color: var(--chip-sel-fg); }

    /* ── Category nav items ────────────────────────────────────────── */
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px;
      border-radius: 0.5rem;
      color: var(--text-muted);
      cursor: pointer; border: none;
      background: transparent;
      font-size: 13px; text-align: left; width: 100%;
      transition: background .15s, color .15s;
    }
    .nav-item:hover { background: var(--bg-ctrl); color: var(--text); }
    .nav-item.active { background: var(--bg-card); color: var(--text); font-weight: 600; }

    /* ── Filter chips ──────────────────────────────────────────────── */
    .chip {
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 11px; font-weight: 500;
      cursor: pointer; border: none;
      background: var(--bg-chip);
      color: var(--text-muted);
      transition: background .15s, color .15s;
    }
    .chip:hover { background: var(--bg-chip-sel); color: var(--chip-sel-fg); }
    .chip.active { background: var(--bg-chip-sel); color: var(--chip-sel-fg); font-weight: 700; }

    /* ── Font cards ────────────────────────────────────────────────── */
    .font-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 20px;
      break-inside: avoid;
      margin-bottom: 20px;
      transition: box-shadow .25s, transform .15s;
    }
    .font-card:hover {
      box-shadow: 0 10px 30px var(--shadow);
      transform: translateY(-2px);
    }

    /* ── Tag pills inside cards ────────────────────────────────────── */
    .tag {
      font-size: 9px; font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: .04em;
      background: var(--bg-chip);
      color: var(--text-muted);
    }
    .tag.cat { background: var(--bg-chip-sel); color: var(--chip-sel-fg); }

    /* ── Preview text ──────────────────────────────────────────────── */
    .preview-text {
      line-height: 1.15;
      word-break: break-word;
      min-height: 2em;
    }

    /* ── Stroke mode ── hollow outline, no background change ───────── */
    .preview-text.stroke {
      -webkit-text-stroke: 3px var(--text);
      color: transparent;
    }
    html.dark .preview-text.stroke {
      -webkit-text-stroke: 3px var(--text);
      color: transparent;
    }
    /* Wrapper: no change in stroke mode */

    /* ── Advanced search panel ────────────────────────────────────── */
    #adv-panel {
      background: var(--bg-low);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
      transition: max-height .25s ease, padding .25s ease;
      max-height: 0;
      padding: 0 20px;
    }
    #adv-panel.open {
      max-height: 300px;
      padding: 14px 20px;
    }
    .adv-chip {
      display: inline-flex; align-items: center;
      padding: 4px 11px;
      border-radius: 9999px;
      font-size: 11px; font-weight: 500;
      cursor: pointer; border: none;
      background: var(--bg-chip);
      color: var(--text-muted);
      transition: background .12s, color .12s;
      margin: 3px 3px 3px 0;
    }
    .adv-chip:hover { background: var(--bg-chip-sel); color: var(--chip-sel-fg); }
    .adv-chip.active { background: var(--bg-chip-sel); color: var(--chip-sel-fg); font-weight: 700; }
    .adv-section-label {
      font-size: 10px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--text-faint); margin-bottom: 6px; margin-top: 12px;
    }
    .adv-section-label:first-child { margin-top: 0; }

    /* ── Masonry ───────────────────────────────────────────────────── */
    .masonry { column-count: 1; column-gap: 20px; }
    @media (min-width: 640px)  { .masonry { column-count: 2; } }
    @media (min-width: 1280px) { .masonry { column-count: 3; } }

    /* ── Copy flash ────────────────────────────────────────────────── */
    @keyframes flash { 0%,100%{opacity:1} 50%{opacity:.4} }
    .flashing { animation: flash .35s ease; }

    /* ── Glass (mobile nav) ────────────────────────────────────────── */
    .glass {
      background: rgba(246,250,254,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    html.dark .glass {
      background: rgba(15,23,42,0.88);
    }

    /* ── Sig gradient button ───────────────────────────────────────── */
    .sig-grad { background: linear-gradient(135deg,#000 0%,#131b2e 100%); }

    /* ── Section heading in sidebar ────────────────────────────────── */
    .sidebar-label {
      font-size: 10px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 8px;
    }

    /* ── Footer ────────────────────────────────────────────────────── */
    #page-footer {
      border-top: 1px solid var(--border);
      background: var(--bg-low);
    }
  </style>
</head>

<body>

<!-- ═══════════════════ TOP NAV ═══════════════════ -->
<nav id="topnav" class="fixed top-0 w-full z-50 flex justify-between items-center px-6 h-16">
  <div style="font-size:18px;font-weight:800;letter-spacing:-.03em;">Saki's Typesetter Handbook</div>

  <div class="hidden md:flex items-center gap-8" style="font-size:13px;font-weight:500;">

    <a href="https://forms.gle/RXnsY6APGu7Z74f38" target="_blank" rel="noopener"

</nav>

<!-- ═══════════════════ SIDEBAR ═══════════════════ -->
<aside id="sidebar" class="hidden md:flex" style="

">

      </button>
      <button class="nav-item" data-cat="romance">
        <span class="material-symbols-outlined" style="font-size:16px;">favorite</span> Romance
      </button>
      <button class="nav-item" data-cat="title">
        <span class="material-symbols-outlined" style="font-size:16px;">title</span> Titles
      </button>
      <button class="nav-item" data-cat="narration">
        <span class="material-symbols-outlined" style="font-size:16px;">article</span> Narration
      </button>
      <button class="nav-item" data-cat="handwritten">

</aside>

<!-- ═══════════════════ MAIN ═══════════════════ -->
<main style="padding-top:64px;" class="md:ml-60">

  ">

      </div>

      <!-- Preview text input -->
      <div style="
        display:flex;align-items:center;gap:6px;flex-shrink:0;
        background:var(--bg-ctrl);border-radius:10px;padding:6px 12px;
      ">
        <span class="material-symbols-outlined" style="font-size:16px;color:var(--text-faint);">text_fields</span>
        <input id="sample" type="text" value="It's37!?&* [)>" class="text-input" style="width:130px;font-size:12px;" />

    ">
      <span>Saki's Typesetter Handbook</span>
      <a href="https://forms.gle/RXnsY6APGu7Z74f38" target="_blank" rel="noopener"

        Submit a Font <span class="material-symbols-outlined" style="font-size:13px;">open_in_new</span>
      </a>
    </div>
  </footer>
</main>

<!-- ═══════════════════ MOBILE BOTTOM NAV ═══════════════════ -->
<div class="md:hidden glass" style="
  position:fixed;bottom:0;left:0;width:100%;

<!-- ═══════════════════ SCRIPTS ═══════════════════ -->
<script src="font.js"></script>
<script>
  // ── State ────────────────────────────────────────────────────────
  let activeCat   = '';
  let activeSrc   = '';
  let isUpper     = false;
  let isStroke    = false;
  let activeTags  = new Set(); // advanced search selected tags/emos

  // ── DOM refs ─────────────────────────────────────────────────────
  const grid      = document.getElementById('grid');
  const qEl       = document.getElementById('q');
  const sampleEl  = document.getElementById('sample');
  const sizeEl    = document.getElementById('size');
  const trackEl   = document.getElementById('track');
  const sizeValEl = document.getElementById('sizeVal');
  const trackValEl= document.getElementById('trackVal');
  const countLbl  = document.getElementById('count-lbl');
  const sortSel   = document.getElementById('sort');
  const upperBtn  = document.getElementById('upper-btn');
  const strokeBtn = document.getElementById('stroke-btn');
  const dmBtn     = document.getElementById('dm-btn');

  // ── Dark mode ─────────────────────────────────────────────────────
  dmBtn.addEventListener('click', () => {
    const isDark = document.documentElement.classList.toggle('dark');
    dmBtn.querySelector('.material-symbols-outlined').textContent = isDark ? 'light_mode' : 'dark_mode';
  });

  // ── Font loaders (fire-and-forget, non-blocking) ──────────────────
  const _loadedFonts = new Set();

  function loadGoogleFontLink(name) {
    if (_loadedFonts.has(name)) return;
    _loadedFonts.add(name);
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(name).replaceAll('%20','+')}:wght@400;700&display=swap`;
    document.head.appendChild(link);
  }

  function loadEmbedFont(item) {
    if (_loadedFonts.has(item.name) || !item.embed) return;
    _loadedFonts.add(item.name);
    const isWOFF = /\.woff2?$/i.test(item.embed);
    const fmt = isWOFF ? (item.embed.endsWith('2') ? 'woff2' : 'woff') : 'truetype';
    const s = document.createElement('style');
    s.textContent = `@font-face{font-family:'${item.name}';src:url('${item.embed}') format('${fmt}');font-display:swap;}`;
    document.head.appendChild(s);
  }

  function kickFonts(items) {
    // Fire ALL font loads in parallel — browser handles deduplication
    items.forEach(item => {
      if (item.source === 'google') loadGoogleFontLink(item.name);
      else loadEmbedFont(item);
    });
  }

  // ── Build a single card (synchronous) ────────────────────────────
  function buildCard(item) {
    const allTags = [...new Set([...(item.tags||[]), ...(item.emo||[]), ...(item.cat||[])])];

    const card = document.createElement('div');
    card.className = 'font-card';

    // — Header row —
    const hdr = document.createElement('div');
    hdr.style.cssText = 'display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:8px;';

    const nameWrap = document.createElement('div');
    nameWrap.style.cssText = 'min-width:0;flex:1;';

    const copyBtn = document.createElement('button');
    copyBtn.style.cssText = `
      background:none;border:none;cursor:pointer;
      font-size:15px;font-weight:700;letter-spacing:-.01em;
      color:var(--text);text-align:left;
      transition:color .15s;padding:0;line-height:1.3;
    `;
    copyBtn.title = 'Click to copy font name';
    copyBtn.textContent = item.name;
    copyBtn.onmouseover = () => copyBtn.style.color = 'var(--tint)';
    copyBtn.onmouseout  = () => copyBtn.style.color = 'var(--text)';

    const srcLabel = document.createElement('div');
    srcLabel.style.cssText = 'font-size:10px;font-family:"Roboto Mono";color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;';
    srcLabel.textContent = item.source;

    nameWrap.append(copyBtn, srcLabel);

    const linkBtn = document.createElement('a');
    linkBtn.href = item.url;
    linkBtn.target = '_blank';
    linkBtn.rel = 'noopener';
    linkBtn.title = `Open ${item.name} source page`;
    linkBtn.style.cssText = `
      flex-shrink:0;width:30px;height:30px;border-radius:8px;
      border:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;
      color:var(--text-faint);transition:color .15s,background .15s;
      text-decoration:none;
    `;
    linkBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px;">open_in_new</span>';
    linkBtn.onmouseover = () => { linkBtn.style.color='var(--text)'; linkBtn.style.background='var(--bg-ctrl)'; };
    linkBtn.onmouseout  = () => { linkBtn.style.color='var(--text-faint)'; linkBtn.style.background=''; };

    hdr.append(nameWrap, linkBtn);

    // — Preview area —
    const previewWrap = document.createElement('div');
    previewWrap.className = 'preview-wrap';
    previewWrap.style.cssText = 'padding:20px 0;border-bottom:1px solid var(--border);margin-bottom:14px;transition:background .15s,padding .15s,border-radius .15s,margin .15s;';
    if (isStroke) previewWrap.classList.add('stroke-active');

    const previewText = document.createElement('div');
    previewText.className = 'preview-text';
    previewText.dataset.font = item.name;
    previewText.textContent = sampleEl.value || 'Sample';
    applyPreviewStyle(previewText, item.name);

    previewWrap.appendChild(previewText);

    // — Tags —
    const tagsRow = document.createElement('div');
    tagsRow.style.cssText = 'display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;';
    allTags.slice(0, 6).forEach(t => {
      const span = document.createElement('span');
      span.className = 'tag' + ((item.cat||[]).includes(t) ? ' cat' : '');
      span.textContent = t;
      tagsRow.appendChild(span);
    });

    // — Notes —
    const notes = document.createElement('p');
    notes.style.cssText = 'font-size:11px;color:var(--text-faint);line-height:1.5;margin:0;';
    notes.textContent = item.notes || '';

    // — Copy feedback —
    const copyFb = document.createElement('span');
    copyFb.style.cssText = 'font-size:10px;font-family:"Roboto Mono";color:var(--tint);opacity:0;transition:opacity .2s;display:block;margin-top:6px;height:14px;';
    copyFb.textContent = '✓ Copied!';

    card.append(hdr, previewWrap, tagsRow, notes, copyFb);

    // copy on click
    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(item.name);
        copyFb.style.opacity = '1';
        copyFb.classList.add('flashing');
        setTimeout(() => { copyFb.style.opacity = '0'; copyFb.classList.remove('flashing'); }, 1600);
      } catch(e) {}
    });

    return card;
  }

  // ── Apply preview style to text el + its wrapper ─────────────────
  function applyPreviewStyle(el, fontName) {
    el.style.fontFamily    = `'${fontName}', system-ui, sans-serif`;
    el.style.fontSize      = sizeEl.value + 'px';
    el.style.letterSpacing = trackEl.value + 'px';
    el.style.textTransform = isUpper ? 'uppercase' : 'none';
    el.classList.toggle('stroke', isStroke);
    // Sync wrapper stroke-active class
    const wrap = el.closest('.preview-wrap');
    if (wrap) wrap.classList.toggle('stroke-active', isStroke);
  }

  // ── Update all existing preview styles (sliders/toggles) ─────────
  function updatePreviews() {
    grid.querySelectorAll('.preview-text').forEach(el => {
      el.textContent = sampleEl.value || 'Sample';
      applyPreviewStyle(el, el.dataset.font);
    });
  }

  // ── Filter & sort ─────────────────────────────────────────────────
  function matchesFilter(item) {
    const q = (qEl.value || '').toLowerCase().trim();
    if (q) {
      const hay = [
        item.name, item.source,
        ...(item.tags||[]), ...(item.emo||[]), ...(item.cat||[]),
        item.notes || ''
      ].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (activeCat) {
      const cats = [...(item.tags||[]), ...(item.cat||[])].join(' ').toLowerCase();
      if (!cats.includes(activeCat)) return false;
    }
    if (activeSrc && item.source !== activeSrc) return false;
    // Advanced tag filter: item must match ANY selected tag/emo (OR logic)
    if (activeTags.size > 0) {
      const all = [...(item.tags||[]), ...(item.emo||[]), ...(item.cat||[])];
      if (!all.some(t => activeTags.has(t))) return false;
    }
    return true;
  }

  // ── Build advanced search tag clouds ─────────────────────────────
  function buildTagClouds() {
    const emoCount = new Map();
    const tagCount = new Map();
    FONTS.forEach(f => {
      (f.emo||[]).forEach(e => emoCount.set(e, (emoCount.get(e)||0) + 1));
      (f.tags||[]).forEach(t => tagCount.set(t, (tagCount.get(t)||0) + 1));
    });
    const sorted = (map) => [...map.entries()].sort((a,b) => b[1]-a[1]).map(([k])=>k);

    function makeChip(label, container) {
      const btn = document.createElement('button');
      btn.className = 'adv-chip';
      btn.textContent = label;
      btn.addEventListener('click', () => {
        if (activeTags.has(label)) {
          activeTags.delete(label);
          btn.classList.remove('active');
        } else {
          activeTags.add(label);
          btn.classList.add('active');
        }
        updateAdvCount();
        render();
      });
      container.appendChild(btn);
    }

    const emoCloud = document.getElementById('emo-cloud');
    const tagCloud = document.getElementById('tag-cloud');
    sorted(emoCount).forEach(e => makeChip(e, emoCloud));
    sorted(tagCount).slice(0, 30).forEach(t => makeChip(t, tagCloud));
  }

  function updateAdvCount() {
    const n = activeTags.size;
    const advBtn = document.getElementById('adv-btn');
    const icon = advBtn.querySelector('.material-symbols-outlined');
    advBtn.classList.toggle('active', n > 0 || document.getElementById('adv-panel').classList.contains('open'));
    advBtn.childNodes[advBtn.childNodes.length-1].nodeValue = n > 0 ? ` Advanced (${n})` : ' Advanced';
  }

  function doSort(a, b) {
    if (sortSel.value === 'source') return a.source.localeCompare(b.source) || a.name.localeCompare(b.name);
    return a.name.localeCompare(b.name);
  }

  // ── RENDER — fully synchronous, no awaiting ───────────────────────
  function render() {
    const data = FONTS.filter(matchesFilter).sort(doSort);
    countLbl.textContent = `${data.length} font${data.length !== 1 ? 's' : ''}`;

    // 1. Kick all font loads in parallel (fire-and-forget)
    kickFonts(data);

    // 2. Build all cards synchronously into a fragment
    const frag = document.createDocumentFragment();
    data.forEach(item => frag.appendChild(buildCard(item)));

    // 3. Single DOM write
    grid.innerHTML = '';
    grid.appendChild(frag);
  }

  // ── Category nav ─────────────────────────────────────────────────
  document.querySelectorAll('#cat-filters button[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCat = btn.dataset.cat;
      document.querySelectorAll('#cat-filters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  // ── Source chips ─────────────────────────────────────────────────
  document.querySelectorAll('#src-filters button[data-src]').forEach(btn => {
    btn.addEventListener('click', () => {
      activeSrc = btn.dataset.src;
      document.querySelectorAll('#src-filters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  // ── Advanced panel toggle ─────────────────────────────────────────
  document.getElementById('adv-btn').addEventListener('click', () => {
    const panel = document.getElementById('adv-panel');
    const isOpen = panel.classList.toggle('open');
    const advBtn = document.getElementById('adv-btn');
    advBtn.classList.toggle('active', isOpen || activeTags.size > 0);
  });

  // ── Reset ─────────────────────────────────────────────────────────
  document.getElementById('reset-btn').addEventListener('click', () => {
    activeCat = ''; activeSrc = '';
    isUpper = false; isStroke = false;
    activeTags.clear();
    document.querySelectorAll('.adv-chip').forEach(c => c.classList.remove('active'));
    document.getElementById('adv-panel').classList.remove('open');
    qEl.value = '';
    sizeEl.value = 35; sizeValEl.textContent = '35px';
    trackEl.value = 0; trackValEl.textContent = '0';
    sampleEl.value = "It's37!?&* [)>";
    sortSel.value = 'name';
    upperBtn.classList.remove('active');
    strokeBtn.classList.remove('active');
    document.getElementById('adv-btn').classList.remove('active');
    document.querySelector('#adv-btn').childNodes[document.querySelector('#adv-btn').childNodes.length-1].nodeValue = ' Advanced';
    document.querySelectorAll('#cat-filters button').forEach((b,i) => {
      b.classList.toggle('active', i === 0);
    });
    document.querySelectorAll('#src-filters button').forEach((b,i) => {
      b.classList.toggle('active', i === 0);
    });
    render();
  });

  // ── Toggle buttons ────────────────────────────────────────────────
  upperBtn.addEventListener('click', () => {
    isUpper = !isUpper;
    upperBtn.classList.toggle('active', isUpper);
    updatePreviews();
  });

  strokeBtn.addEventListener('click', () => {
    isStroke = !isStroke;
    strokeBtn.classList.toggle('active', isStroke);
    updatePreviews();
  });

  // ── Sliders & text inputs — update existing cards, don't re-render
  sizeEl.addEventListener('input', () => {
    sizeValEl.textContent = sizeEl.value + 'px';
    updatePreviews();
  });
  trackEl.addEventListener('input', () => {
    trackValEl.textContent = trackEl.value;
    updatePreviews();
  });
  sampleEl.addEventListener('input', updatePreviews);

  // ── Search & sort — need full re-render ─────────────────────────
  qEl.addEventListener('input', render);
  sortSel.addEventListener('change', render);

  // ── Init ──────────────────────────────────────────────────────────
  buildTagClouds();
  render();
</script>
</body>
</html>
